name: Universal Android & Native Builder

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Direct link to the ZIP project'
        required: true
        type: string
      build_type:
        description: 'Project build type'
        required: true
        default: 'AUTO'
        type: choice
        options:
          - 'AUTO'
          - 'GRADLE'
          - 'NDK'
      ndk_version:
        description: 'NDK Version'
        required: true
        default: '25.2.9519653'
        type: string
      java_version:
        description: 'Java Version'
        required: true
        default: '17'
        type: choice
        options: ['11', '17', '21']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Extract project
        run: |
          curl -L "${{ github.event.inputs.zip_url }}" -o project.zip
          unzip -q project.zip -d extracted_project

      - name: Setup Java ${{ github.event.inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.java_version }}
          distribution: 'temurin'

      - name: Setup NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ github.event.inputs.ndk_version }}" --sdk_root=$ANDROID_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ github.event.inputs.ndk_version }}" >> $GITHUB_ENV

      - name: Execute build
        run: |
          cd extracted_project
          
          MODE="${{ github.event.inputs.build_type }}"
          
          GRADLE_FILE=""
          MK_FILE=""
          CMAKE_FILE=""

          if [ "$MODE" = "GRADLE" ]; then
            GRADLE_FILE=$(find . \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path "*/app/*" | head -1)
            if [ -z "$GRADLE_FILE" ]; then echo "Gradle files not found"; exit 1; fi
          elif [ "$MODE" = "NDK" ]; then
            MK_FILE=$(find . -name "Android.mk" | head -1)
            CMAKE_FILE=$(find . -name "CMakeLists.txt" | head -1)
            if [ -z "$MK_FILE" ] && [ -z "$CMAKE_FILE" ]; then echo "NDK files not found"; exit 1; fi
          else
            GRADLE_FILE=$(find . \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path "*/app/*" | head -1)
            MK_FILE=$(find . -name "Android.mk" | head -1)
            CMAKE_FILE=$(find . -name "CMakeLists.txt" | head -1)
          fi

          ABIS="armeabi-v7a arm64-v8a x86 x86_64"
          ABIS_COMMAS="armeabi-v7a,arm64-v8a,x86,x86_64"

          # Fix architecture specific issues on the fly
          C_FILE=$(find . -name "enet_samp_hook_v11.c" -o -name "etr.c" | head -1)
          if [ -n "$C_FILE" ]; then
            echo "Patching $C_FILE for cross-architecture support..."
            
            # 1. Update POOL_TAG to be 32/64 bit safe
            sed -i 's|#define POOL_TAG.*|#ifdef __LP64__\n#define POOL_TAG ((uintptr_t)1ULL << 63)\n#else\n#define POOL_TAG ((uintptr_t)1UL << 31)\n#endif|g' "$C_FILE"
            
            # 2. Make ENet structural static assertions conditionally compiled for 64-bit only
            sed -i 's|_Static_assert(offsetof(ENetPacket, flags)|#ifdef __LP64__\n_Static_assert(offsetof(ENetPacket, flags)|g' "$C_FILE"
            sed -i 's|_Static_assert(offsetof(ENetPacket, userData).*|_Static_assert(offsetof(ENetPacket, userData)     == 0x28, "ENetPacket.userData offset");\n#endif|g' "$C_FILE"
          fi

          if [ -n "$GRADLE_FILE" ] && [ "$MODE" != "NDK" ]; then
            cd "$(dirname "$GRADLE_FILE")"
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
            if [ ! -f gradlew ]; then gradle wrapper --gradle-version=8.2; fi
            chmod +x gradlew
            ./gradlew assembleRelease assembleDebug -Pandroid.injected.build.abi="$ABIS_COMMAS" --stacktrace

          elif [ -n "$MK_FILE" ]; then
            MK_ABS_PATH=$(realpath "$MK_FILE")
            MK_DIR=$(dirname "$MK_ABS_PATH")
            
            APP_MK=$(find "$MK_DIR" -name "Application.mk" | head -1)
            
            cd "$MK_DIR"
            sed -i 's|\.\./||g' "$MK_ABS_PATH"
            
            $ANDROID_NDK_HOME/ndk-build \
              NDK_PROJECT_PATH=. \
              APP_BUILD_SCRIPT="$MK_ABS_PATH" \
              NDK_APPLICATION_MK="$APP_MK" \
              APP_ABI="$ABIS" \
              APP_PLATFORM=android-21 \
              NDK_OUT="./obj" \
              NDK_LIBS_OUT="./libs"

          elif [ -n "$CMAKE_FILE" ]; then
            CMAKE_ABS_PATH=$(realpath "$CMAKE_FILE")
            CMAKE_DIR=$(dirname "$CMAKE_ABS_PATH")
            
            for abi in $ABIS; do
              mkdir -p "build_$abi"
              cmake -S "$CMAKE_DIR" -B "build_$abi" \
                -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=$abi \
                -DANDROID_PLATFORM=android-21 \
                -DCMAKE_BUILD_TYPE=Release
              cmake --build "build_$abi"
            done
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          
          find extracted_project -type f -name "*.so" | while read -r file; do
            if [[ "$file" == *"/armeabi-v7a/"* ]]; then
              abi="armeabi-v7a"
            elif [[ "$file" == *"/arm64-v8a/"* ]]; then
              abi="arm64-v8a"
            elif [[ "$file" == *"/x86/"* ]]; then
              abi="x86"
            elif [[ "$file" == *"/x86_64/"* ]]; then
              abi="x86_64"
            else
              abi=$(basename "$(dirname "$file")" | sed 's/build_//')
            fi
            
            if [[ "$abi" =~ ^(armeabi-v7a|arm64-v8a|x86|x86_64)$ ]]; then
              mkdir -p "output/$abi"
              cp -f "$file" "output/$abi/"
              echo "Collected: $file -> output/$abi/$(basename "$file")"
            fi
          done
          
          find extracted_project -type f \( -name "*.apk" -o -name "*.aar" \) | while read -r file; do
            cp -f "$file" output/
            echo "Collected: $file -> output/$(basename "$file")"
          done
          
          echo "=== Output directory contents ==="
          ls -R output

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: compiled_libs
          path: output/
          if-no-files-found: error
