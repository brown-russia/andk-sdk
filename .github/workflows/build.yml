name: Universal Android Builder

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Прямая ссылка на ZIP проекта'
        required: true
        type: string
      ndk_version:
        description: 'Версия NDK (r25c)'
        required: true
        default: '25.2.9519653'
        type: string
      abi_armeabi_v7a:
        description: 'Собрать для armeabi-v7a'
        type: boolean
        default: true
      abi_arm64_v8a:
        description: 'Собрать для arm64-v8a'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать и распаковать
        run: |
          curl -L "${{ github.event.inputs.zip_url }}" -o project.zip
          unzip -q project.zip -d extracted_project

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Android SDK и NDK
        run: |
          # Используем полный путь к sdkmanager
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ github.event.inputs.ndk_version }}" --sdk_root=$ANDROID_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ github.event.inputs.ndk_version }}" >> $GITHUB_ENV

      - name: Сборка через ndk-build
        run: |
          # Поиск Android.mk
          MK_FILE=$(find extracted_project -name "Android.mk" | head -1)
          if [ -z "$MK_FILE" ]; then echo "Android.mk не найден"; exit 1; fi
          
          MK_ABS_PATH=$(realpath "$MK_FILE")
          # Определяем корень проекта (родитель папки с .mk файлом)
          PROJECT_ROOT=$(dirname "$MK_ABS_PATH")
          
          # Если файл в папке jni/, корень — на уровень выше
          if [ "$(basename "$PROJECT_ROOT")" = "jni" ]; then
            PROJECT_ROOT=$(dirname "$PROJECT_ROOT")
          fi

          # Формируем список ABI
          ABIS=""
          if [ "${{ github.event.inputs.abi_armeabi_v7a }}" = "true" ]; then ABIS="$ABIS armeabi-v7a"; fi
          if [ "${{ github.event.inputs.abi_arm64_v8a }}" = "true" ]; then ABIS="$ABIS arm64-v8a"; fi
          
          echo "Запуск сборки из: $PROJECT_ROOT"
          
          $ANDROID_NDK_HOME/ndk-build \
            -C "$PROJECT_ROOT" \
            APP_BUILD_SCRIPT="$MK_ABS_PATH" \
            APP_ABI="$ABIS" \
            APP_PLATFORM=android-21 \
            NDK_OUT="$PROJECT_ROOT/obj" \
            NDK_LIBS_OUT="$PROJECT_ROOT/libs"

      - name: Сбор и загрузка .so файлов
        run: |
          mkdir -p output_libs
          # Копируем только скомпилированные библиотеки с сохранением структуры папок (архитектур)
          find extracted_project -name "*.so" -exec cp --parents {} output_libs/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-libs-api21
          path: output_libs/
