name: Universal Android & Native Builder

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Прямая ссылка на ZIP проекта'
        required: true
        type: string
      ndk_version:
        description: 'Версия NDK (по умолчанию r25c)'
        required: true
        default: '25.2.9519653'
        type: string
      cmake_version:
        description: 'Версия CMake'
        required: true
        default: '3.22.1'
        type: string
      java_version:
        description: 'Версия Java'
        required: true
        default: '17'
        type: choice
        options:
          - '11'
          - '17'
          - '21'
      abi_armeabi_v7a:
        description: 'Собрать .so для armeabi-v7a'
        type: boolean
        default: true
      abi_arm64_v8a:
        description: 'Собрать .so для arm64-v8a'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать и распаковать архив
        run: |
          curl -L "${{ github.event.inputs.zip_url }}" -o project.zip
          unzip -q project.zip -d extracted_project

      - name: Установить Java ${{ github.event.inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.java_version }}
          distribution: 'temurin'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить NDK и CMake
        run: |
          yes | sdkmanager --install "ndk;${{ github.event.inputs.ndk_version }}" "cmake;${{ github.event.inputs.cmake_version }}" --sdk_root=$ANDROID_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ github.event.inputs.ndk_version }}" >> $GITHUB_ENV

      - name: Сборка проекта
        run: |
          cd extracted_project
          
          # Глубокий поиск Gradle
          GRADLE_FILE=$(find . \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path "*/app/*" | head -1)
          
          # Глубокий поиск Native файлов
          MK_FILE=$(find . -name "Android.mk" | head -1)
          CMAKE_FILE=$(find . -name "CMakeLists.txt" | head -1)

          if [ -n "$GRADLE_FILE" ]; then
            echo "Найден Gradle проект"
            cd "$(dirname "$GRADLE_FILE")"
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
            if [ ! -f gradlew ]; then gradle wrapper --gradle-version=8.2; fi
            chmod +x gradlew
            ./gradlew assembleRelease assembleDebug --stacktrace
          
          elif [ -n "$MK_FILE" ]; then
            echo "Найден ndk-build проект"
            ABIS=""
            if [ "${{ github.event.inputs.abi_armeabi_v7a }}" = "true" ]; then ABIS="$ABIS armeabi-v7a"; fi
            if [ "${{ github.event.inputs.abi_arm64_v8a }}" = "true" ]; then ABIS="$ABIS arm64-v8a"; fi
            
            MK_DIR=$(dirname "$MK_FILE")
            REAL_MK_FILE=$(realpath "$MK_FILE")
            cd "$MK_DIR"
            # Если файл внутри jni/, выходим на уровень выше для ndk-build
            if [ "$(basename "$PWD")" = "jni" ]; then cd ..; fi
            $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT="$REAL_MK_FILE" APP_ABI="$ABIS" NDK_OUT=./obj NDK_LIBS_OUT=./libs
          
          elif [ -n "$CMAKE_FILE" ]; then
            echo "Найден CMake проект"
            CMAKE_DIR=$(dirname "$CMAKE_FILE")
            ABIS=""
            if [ "${{ github.event.inputs.abi_armeabi_v7a }}" = "true" ]; then ABIS="$ABIS armeabi-v7a"; fi
            if [ "${{ github.event.inputs.abi_arm64_v8a }}" = "true" ]; then ABIS="$ABIS arm64-v8a"; fi
            
            for abi in $ABIS; do
              mkdir -p "build_$abi"
              cmake -S "$CMAKE_DIR" -B "build_$abi" \
                -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=$abi \
                -DANDROID_NDK=$ANDROID_NDK_HOME \
                -DCMAKE_BUILD_TYPE=Release
              cmake --build "build_$abi"
            done
          fi

      - name: Сбор артефактов
        run: |
          mkdir -p output
          find extracted_project -name "*.apk" -o -name "*.aar" -o -name "*.so" -exec cp --parents {} output/ \;

      - name: Загрузить результат
        uses: actions/upload-artifact@v4
        with:
          name: Build-Result
          path: output/
